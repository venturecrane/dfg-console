name = "dfg-api"
main = "src/index.ts"
compatibility_date = "2025-12-15"
compatibility_flags = ["nodejs_compat"]

# =============================================================================
# LOCAL DEVELOPMENT (wrangler dev)
#
# Uses preview D1 database for data isolation.
# Shares the same D1 as dfg-scout (dfg-scout-db).
#
# Usage:
#   wrangler dev                       # Uses these defaults
#   wrangler deploy --env production   # REQUIRED for production deployment
# =============================================================================

[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "dfg-scout-db-preview"
database_id = "1f1376c2-1ca0-4284-b122-1f6c2ecd58be"

# =============================================================================
# PRODUCTION
# =============================================================================
[env.production]
name = "dfg-api"

# Cron paused 2026-04-27 — venture in cold storage. See issue #299.
# Re-enable when active dev resumes by restoring the triggers block:
# [env.production.triggers]
# crons = ["*/5 * * * *"]  # Check watch triggers every 5 minutes

[env.production.vars]
ENVIRONMENT = "production"
# MAKE_WEBHOOK_URL is set via wrangler secret
# RESEND_API_KEY is set via wrangler secret (waitlist confirmations + Captain notify)
# TURNSTILE_SECRET_KEY is set via wrangler secret (waitlist anti-abuse)
# WAITLIST_FROM_EMAIL optional, default "Durgan Field Guide <hello@mail.durganfieldguide.com>"
# WAITLIST_NOTIFY_EMAIL optional, default smdurgan@venturecrane.com

[[env.production.d1_databases]]
binding = "DB"
database_name = "dfg-scout-db"
database_id = "08c267b8-b252-422a-8381-891d12917b33"

# Service binding to dfg-scout for direct worker-to-worker calls
[[env.production.services]]
binding = "SCOUT"
service = "dfg-scout"

# Service binding to dfg-analyst for AI analysis
[[env.production.services]]
binding = "ANALYST"
service = "dfg-analyst"

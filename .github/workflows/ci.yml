name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # DFG App (Next.js) - Lint, Typecheck, Build
  # ============================================
  dfg-app:
    name: DFG App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/dfg-app

      - name: Type check
        run: npm run typecheck --workspace=apps/dfg-app

      - name: Build
        run: npm run build --workspace=apps/dfg-app
        env:
          # Required for Next.js build (use placeholder values in CI)
          DFG_API_URL: https://example.com
          OPS_TOKEN: ci-placeholder

  # ============================================
  # DFG Scout Worker - Typecheck and Tests
  # ============================================
  dfg-scout:
    name: DFG Scout Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/dfg-scout

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  # ============================================
  # DFG API Worker - Typecheck and Tests
  # ============================================
  dfg-api:
    name: DFG API Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/dfg-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  # ============================================
  # DFG Analyst Worker - Typecheck and Tests
  # ============================================
  dfg-analyst:
    name: DFG Analyst Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/dfg-analyst

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
